; 기본 php-fpm pool — compose 가 pool.d/ 를 통째로 마운트하므로 이 파일이 유일한 pool 정의다.
; 도메인별 pool 이 필요하면 sample_php.conf.example 을 복사해 *.conf 로 추가한다.
[www]
user = www-data
group = www-data
; nginx 의 fastcgi_pass php-app:9000 과 일치
listen = 9000
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
request_terminate_timeout = 60s
; 심층 방어 — .php 외 확장자는 FPM 이 실행하지 않는다
security.limit_extensions = .php
