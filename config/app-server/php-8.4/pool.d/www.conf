; 기본 php-fpm pool — compose 가 pool.d/ 를 통째로 마운트하므로 이 파일이 유일한 pool 정의다.
; 도메인별 pool 로 바꿀 때는 이 파일을 대체(삭제 또는 이름 변경)한 뒤 php_conf.sh 로 생성한다.
; 이 파일을 둔 채 같은 포트(9000) pool 을 추가하면 php-fpm 이 주소 충돌로 기동하지 않는다 —
; 함께 둘 때는 다른 포트로 만들고 nginx 의 fastcgi_pass 도 그 포트로 맞출 것.
[www]
user = www-data
group = www-data
; nginx 의 fastcgi_pass php-app:9000 과 일치
listen = 9000
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
request_terminate_timeout = 60s
; 심층 방어 — .php 외 확장자는 FPM 이 실행하지 않는다
security.limit_extensions = .php
