; 기본 php-fpm pool — compose 가 pool.d/ 를 통째로 마운트하므로 이 파일이 유일한 pool 정의다.
; 도메인별 pool 로 바꿀 때는 이 파일을 대체(삭제 또는 이름 변경)한 뒤 php_conf.sh 로 생성한다.
; 이 파일을 둔 채 같은 포트(9000) pool 을 추가하면 php-fpm 이 주소 충돌로 기동하지 않는다 —
; 함께 둘 때는 다른 포트로 만들고 nginx 의 fastcgi_pass 도 그 포트로 맞출 것.
[www]
user = www-data
group = www-data
; nginx 의 fastcgi_pass php-app:9000 과 일치
listen = 9000
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
request_terminate_timeout = 60s
; 심층 방어 — .php 외 확장자는 FPM 이 실행하지 않는다
security.limit_extensions = .php

; ─────────────────────────────────────────────────────────────────────────────
; 아래 지시어는 공식 이미지의 php-fpm.d/docker.conf 가 주던 값이다.
; compose 가 pool.d/ 를 **디렉터리째** 마운트해 그 파일이 가려지므로 여기서 다시 선언한다.
; (단일 파일 마운트로 바꾸면 php_conf.sh 가 만드는 추가 pool 이 로드되지 않으므로
;  이 저장소는 디렉터리 마운트를 유지하고 값을 직접 들고 간다.)
; clear_env 를 빼면 기본값 yes 가 적용되어 **컨테이너 환경변수가 PHP 워커에 전달되지 않는다**
; — getenv() 로 DB 자격증명 등을 읽는 앱이 조용히 빈 값을 받는다.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; 로그는 README §2 의 일원화 구조(호스트 ./log/ → 컨테이너 /log/)를 따른다.
; script/logrotate/php-fpm/php-fpm 이 아래 3개 파일을 copytruncate 로 회전한다.
access.log = /log/php-fpm/access.log
slowlog = /log/php-fpm/slow.log
request_slowlog_timeout = 10s
php_admin_value[error_log] = /log/php-fpm/www-error.log
php_admin_flag[log_errors] = on
